<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 4200" width="1600" height="4200">
  <!-- Signs from my own map, tilted like stickers in the margins. Drawn only on
       screens wide enough that the margins are empty. Where I have been down the
       left and right alike, with what I love off the clock mixed in, one sign
       every 300px so neither side runs empty. -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" opacity=".8">

    <!-- I-80, the interstate past Iowa City and West Liberty -->
    <g transform="translate(108 150) rotate(-5)">
      <path d="M8 6 Q50 -6 92 6 Q100 60 50 104 Q0 60 8 6Z" fill="#1F4E9E" stroke="#fff" stroke-width="4"/>
      <path d="M10 8 Q50 -3 90 8 L89 30 H11Z" fill="#C8102E"/>
      <text x="50" y="25" text-anchor="middle" font-size="11" fill="#fff">INTERSTATE</text>
      <text x="50" y="74" text-anchor="middle" font-size="40" fill="#fff">80</text>
    </g>

    <!-- video games -->
    <g transform="translate(1396 450) rotate(-4)">
      <rect width="118" height="88" rx="10" fill="#14224A" stroke="#fff" stroke-width="4"/>
      <path d="M40 16 H78 C88 16 94 26 95 38 C96 48 90 52 85 48 L78 41 H40 L33 48 C28 52 22 48 23 38 C24 26 30 16 40 16Z" fill="#fff"/>
      <path d="M38 23 h6 v5 h5 v6 h-5 v5 h-6 v-5 h-5 v-6 h5Z" fill="#14224A"/>
      <circle cx="76" cy="26" r="3.6" fill="#C3102F"/>
      <circle cx="84" cy="33" r="3.6" fill="#E0A100"/>
      <text x="59" y="72" text-anchor="middle" font-size="11" fill="#FFC72C" letter-spacing="1">PRESS START</text>
    </g>

    <!-- the Chicago Bears -->
    <g transform="translate(96 750) rotate(4)">
      <rect width="118" height="80" rx="10" fill="#0B162A" stroke="#fff" stroke-width="4"/>
      <rect x="2" y="58" width="114" height="8" fill="#C83803"/>
      <text x="59" y="26" text-anchor="middle" font-size="11" fill="#fff" letter-spacing="3">CHICAGO</text>
      <text x="59" y="48" text-anchor="middle" font-size="16" fill="#fff">BEAR DOWN</text>
    </g>

    <!-- parking, where I have worked since 2023 -->
    <g transform="translate(1400 1050) rotate(4)">
      <rect width="90" height="90" rx="12" fill="#1F4E9E" stroke="#fff" stroke-width="4"/>
      <text x="45" y="70" text-anchor="middle" font-size="64" fill="#fff">P</text>
    </g>

    <!-- a green guide sign home -->
    <g transform="translate(98 1350) rotate(3)">
      <rect width="118" height="78" rx="10" fill="#01513A"/>
      <rect x="4" y="4" width="110" height="70" rx="7" fill="none" stroke="#fff" stroke-width="2.5"/>
      <text x="59" y="33" text-anchor="middle" font-size="19" fill="#fff">Iowa City</text>
      <path d="M59 42 l-11 12 h7 v10 h8 v-10 h7Z" fill="#fff"/>
    </g>

    <!-- Real Madrid, as a match scarf -->
    <g transform="translate(1388 1650) rotate(-6)">
      <path d="M0 8h8M0 15h8M0 22h8M0 29h8M0 36h8M0 43h8M116 8h8M116 15h8M116 22h8M116 29h8M116 36h8M116 43h8" stroke="#FEBE10" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="7" y="2" width="110" height="48" rx="3" fill="#fff" stroke="#1C2C5B" stroke-width="2.5"/>
      <rect x="9" y="3.5" width="10" height="45" fill="#FEBE10"/>
      <rect x="105" y="3.5" width="10" height="45" fill="#FEBE10"/>
      <rect x="22" y="3.5" width="3" height="45" fill="#1C2C5B"/>
      <rect x="99" y="3.5" width="3" height="45" fill="#1C2C5B"/>
      <text x="62" y="23" text-anchor="middle" font-size="14" fill="#1C2C5B">HALA</text>
      <text x="62" y="41" text-anchor="middle" font-size="14" fill="#1C2C5B">MADRID</text>
    </g>

    <!-- hikes: a brown trail sign -->
    <g transform="translate(100 1950) rotate(-3)">
      <rect width="110" height="104" rx="10" fill="#6B3D1F" stroke="#fff" stroke-width="4"/>
      <rect x="6" y="6" width="98" height="92" rx="6" fill="none" stroke="#fff" stroke-width="2"/>
      <circle cx="53" cy="20" r="6.5" fill="#fff"/>
      <rect x="37" y="29" width="10" height="19" rx="3" fill="#fff"/>
      <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
        <path d="M51 31 L48 50" stroke-width="8"/>
        <path d="M48 51 L41 69 M48 51 L57 69 M51 34 L62 44" stroke-width="5"/>
        <path d="M65 30 L59 72" stroke-width="3"/>
      </g>
      <text x="55" y="89" text-anchor="middle" font-size="14" fill="#fff" letter-spacing="1.5">TRAIL</text>
    </g>

    <!-- a Tokyo station board, from the summer at Sollo -->
    <g transform="translate(1392 2250) rotate(-4)">
      <rect width="120" height="72" rx="6" fill="#fff" stroke="#C9CED8" stroke-width="2"/>
      <rect y="56" width="120" height="16" rx="0" fill="#C3102F"/>
      <text x="60" y="34" text-anchor="middle" font-size="26" fill="#14171F" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">東京</text>
      <text x="60" y="50" text-anchor="middle" font-size="11" fill="#5B6270">Tōkyō</text>
    </g>

    <!-- trucks crossing: the one-truck owner-operator -->
    <g transform="translate(108 2550) rotate(-3)">
      <rect x="15" y="15" width="72" height="72" rx="8" transform="rotate(45 51 51)" fill="#FBB214" stroke="#14171F" stroke-width="4"/>
      <path d="M26 46 h30 v18 h-30Z M58 52 h10 l6 6 v6 h-16Z" fill="#14171F"/>
      <circle cx="34" cy="68" r="5" fill="#14171F"/><circle cx="50" cy="68" r="5" fill="#14171F"/><circle cx="68" cy="68" r="5" fill="#14171F"/>
    </g>

    <!-- pickleball, on a brown recreation sign -->
    <g transform="translate(1398 2850) rotate(4)">
      <rect width="112" height="104" rx="10" fill="#6B3D1F" stroke="#fff" stroke-width="4"/>
      <rect x="6" y="6" width="100" height="92" rx="6" fill="none" stroke="#fff" stroke-width="2"/>
      <g transform="rotate(30 44 44)" fill="#fff">
        <rect x="29" y="14" width="30" height="36" rx="13"/>
        <rect x="40" y="48" width="8" height="20" rx="3"/>
      </g>
      <circle cx="86" cy="30" r="10" fill="#FFC72C"/>
      <g fill="#6B3D1F">
        <circle cx="82" cy="27" r="1.8"/><circle cx="90" cy="27" r="1.8"/><circle cx="86" cy="34" r="1.8"/>
      </g>
      <text x="56" y="89" text-anchor="middle" font-size="13" fill="#fff" letter-spacing=".5">PICKLEBALL</text>
    </g>

    <!-- mountains, on a green guide sign like the one home -->
    <g transform="translate(96 3150) rotate(3)">
      <rect width="120" height="92" rx="10" fill="#01513A"/>
      <rect x="4" y="4" width="112" height="84" rx="7" fill="none" stroke="#fff" stroke-width="2.5"/>
      <path d="M20 60 L45 24 L57 40 L70 20 L100 60Z" fill="#fff"/>
      <path d="M38 34 L45 24 L51 32 L47 30 L44 34 L41 31Z M64 29 L70 20 L77 30 L73 28 L70 31 L67 28Z" fill="#01513A"/>
      <text x="60" y="80" text-anchor="middle" font-size="16" fill="#fff">Mountains</text>
    </g>

    <!-- hola, the other language I think in -->
    <g transform="translate(1398 3450) rotate(5)">
      <path d="M8 0 H104 Q112 0 112 8 V50 Q112 58 104 58 H36 L20 74 V58 H8 Q0 58 0 50 V8 Q0 0 8 0Z" fill="#fff" stroke="#14224A" stroke-width="3"/>
      <text x="56" y="38" text-anchor="middle" font-size="24" fill="#14224A">¡Hola!</text>
    </g>

    <!-- welcome, in the Easy Japanese the app spoke -->
    <g transform="translate(100 3750) rotate(-4)">
      <path d="M8 0 H108 Q116 0 116 8 V50 Q116 58 108 58 H96 V74 L80 58 H8 Q0 58 0 50 V8 Q0 0 8 0Z" fill="#FFC72C" stroke="#14171F" stroke-width="3"/>
      <text x="58" y="38" text-anchor="middle" font-size="21" fill="#14171F" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif">ようこそ</text>
    </g>

    <!-- road trips -->
    <g transform="translate(1396 4050) rotate(-5)">
      <rect width="118" height="92" rx="10" fill="#1F4E9E" stroke="#fff" stroke-width="4"/>
      <path d="M22 50 L28 36 Q30 32 35 32 H72 Q77 32 80 36 L88 46 H94 Q98 46 98 50 V58 H22Z" fill="#fff"/>
      <path d="M34 36 H52 V46 H30Z M56 36 H72 L79 46 H56Z" fill="#1F4E9E"/>
      <circle cx="38" cy="58" r="7" fill="#fff" stroke="#1F4E9E" stroke-width="3"/>
      <circle cx="82" cy="58" r="7" fill="#fff" stroke="#1F4E9E" stroke-width="3"/>
      <text x="59" y="83" text-anchor="middle" font-size="13" fill="#fff" letter-spacing="1">ROAD TRIP</text>
    </g>
  </g>
</svg>
