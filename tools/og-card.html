<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card source &middot; 1200x630</title>
<!--
  Source for assets/og/share-card.png, the LinkedIn / X share card.
  Renders at exactly 1200x630. To regenerate:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --force-device-scale-factor=1 \
      --virtual-time-budget=12000 \
      --screenshot=assets/og/share-card.png \
      tools/og-card.html
  Tokens match styles.css. Keep them in step. The sign on the right is the
  landing page's directory, so the preview and the page agree.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Overpass:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFE9DE; --ink:#14171F; --ink-2:#414856; --ink-3:#5B6270; --rule:#D8DBD3;
  --sign:#14224A; --sign-2:#AEB9D6; --hi:#FFC72C;
  --c:#B4460A; --s:#C3102F; --u:#00735E; --l:#5A3DB0;
  --display:"Overpass","Helvetica Neue",Arial,sans-serif;
  --sans:"Atkinson Hyperlegible Next",-apple-system,system-ui,sans-serif;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ width:1200px; height:630px; overflow:hidden; }
body{ background:var(--bg); color:var(--ink); font-family:var(--sans); }

.card{
  width:1200px; height:630px; padding:60px 64px;
  display:grid; grid-template-columns:1fr 420px; gap:52px;
}
.left{ display:flex; flex-direction:column; }

.role{ font-family:var(--display); font-weight:700; font-size:26px; color:var(--ink-2); }
h1{
  margin:14px 0 0; font-family:var(--display); font-weight:800;
  font-size:98px; line-height:.95; letter-spacing:-.03em;
}
.thesis{ margin:26px 0 0; font-size:25px; line-height:1.42; color:var(--ink-2); max-width:580px; }

.nums{ display:flex; gap:34px; margin:auto 0 0; }
.nums div{ border-top:5px solid var(--sign); padding-top:14px; }
.nums b{ display:block; font-family:var(--display); font-weight:800; font-size:42px; line-height:1; color:var(--sign); }
.nums span{ display:block; margin-top:8px; font-size:16px; line-height:1.3; color:var(--ink-3); }

.sign{
  background:var(--sign); color:#fff; border-radius:16px;
  padding:26px 24px 12px; align-self:center;
}
.here{
  display:flex; align-items:center; gap:12px;
  font-family:var(--display); font-weight:700; font-size:20px; color:var(--sign-2);
  padding:0 6px 18px; border-bottom:2px solid #FFFFFF26;
}
.here i{ width:18px; height:18px; border-radius:50%; background:var(--hi); }
.row{ display:flex; align-items:center; gap:18px; padding:16px 6px; }
.row + .row{ border-top:1px solid #FFFFFF1F; }
.line{
  display:grid; place-items:center; width:46px; height:46px; border-radius:10px;
  font-family:var(--display); font-weight:900; font-size:24px; padding-top:4px;
  box-shadow:0 0 0 3px #fff;
}
.row b{ font-family:var(--display); font-weight:800; font-size:30px; line-height:1; padding-top:4px; }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <p class="role">Product designer and UX engineer</p>
    <h1>David<br>Martinez</h1>
    <p class="thesis">I design and build software. Product designer and UX engineer.</p>
    <div class="nums">
      <div><b>70+</b><span>pull requests merged<br>in eight weeks</span></div>
      <div><b>2,949</b><span>tests green<br>at handoff</span></div>
      <div><b>9</b><span>languages<br>shipped</span></div>
    </div>
  </div>

  <div class="sign">
    <p class="here"><i></i>You are here. Where to?</p>
    <div class="row"><span class="line" style="background:var(--c)">C</span><b>Centline</b></div>
    <div class="row"><span class="line" style="background:var(--s)">S</span><b>Sollo</b></div>
    <div class="row"><span class="line" style="background:var(--u)">U</span><b>CommU</b></div>
    <div class="row"><span class="line" style="background:var(--l)">L</span><b>Component lab</b></div>
  </div>
</div>
</body>
</html>
